name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release + upload assets

jobs:
  release:
    runs-on: macos-14 # Apple silicon → arm64 DMG, matches v0.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build unsigned. CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder from
      # attempting to sign; --publish never stops it from publishing on its own (we attach below).
      - run: npx electron-vite build
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true # auto changelog from merged PRs/commits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
